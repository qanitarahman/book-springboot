<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Beranda – Perpustakaan</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('beranda')}"></div>
<div class="container">
  <h1>Beranda</h1>
  <div class="summary-grid">
    <div class="summary-card">
      <div class="value" th:text="${totalStok}">0</div>
      <div class="label">Total Stok Buku</div>
    </div>
    <div class="summary-card">
      <div class="value" th:text="${jumlahAnggota}">0</div>
      <div class="label">Jumlah Anggota</div>
    </div>
    <div class="summary-card">
      <div class="value" th:text="${sedangDipinjam}">0</div>
      <div class="label">Sedang Dipinjam</div>
    </div>
    <div class="summary-card">
      <div class="value" th:text="${jumlahTerlambat}">0</div>
      <div class="label">Terlambat</div>
    </div>
  </div>
</div>
</body>
</html>
