<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Peminjaman – Perpustakaan</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('pinjam')}"></div>
<div class="container">
  <h1>Peminjaman dan Pengembalian</h1>

  <div class="card">
    <h2>Pinjam Buku</h2>
    <div th:if="${pesan}" class="alert alert-danger">
      <span th:text="${pesan}"></span>
      <span th:if="${bisaReservasi}"> &mdash; <a href="#" class="link">Ajukan Reservasi</a></span>
    </div>
    <form th:action="@{/pinjam}" method="post" class="form-row">
      <select name="idAnggota" required>
        <option value="" disabled selected>-- pilih anggota --</option>
        <option th:each="a : ${daftarAnggota}"
                th:value="${a.idAnggota}"
                th:text="${a.idAnggota + ' – ' + a.nama}"></option>
      </select>
      <select name="idBuku" required>
        <option value="" disabled selected>-- pilih buku --</option>
        <option th:each="b : ${daftarBuku}"
                th:value="${b.idBuku}"
                th:text="${b.judul + ' (stok: ' + b.stok + ')'}"></option>
      </select>
      <button type="submit" class="btn btn-primary">Pinjam</button>
    </form>
    <p style="font-size:0.82rem;color:var(--text-muted);margin-top:10px;">Lama pinjam 7 hari.</p>
  </div>

  <div class="card">
    <h2>Sedang Dipinjam</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>No</th><th>Anggota</th><th>Buku</th><th>Tgl Pinjam</th><th>Jatuh Tempo</th><th>Status</th><th>Aksi</th></tr>
        </thead>
        <tbody>
          <tr th:each="t,i : ${sedangDipinjam}">
            <td th:text="${i.count}"></td>
            <td th:text="${t.anggota.nama}"></td>
            <td th:text="${t.buku.judul}"></td>
            <td th:text="${t.tanggalPinjam}"></td>
            <td th:text="${t.jatuhTempo}"></td>
            <td>
              <span th:if="${t.terlambat}"  class="badge badge-danger">Terlambat</span>
              <span th:if="${!t.terlambat}" class="badge badge-success">Dipinjam</span>
            </td>
            <td>
              <form th:action="@{/pinjam/kembali}" method="post" style="display:inline">
                <input type="hidden" name="idTransaksi" th:value="${t.idTransaksi}">
                <button type="submit" class="btn btn-primary btn-sm">Kembalikan</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(sedangDipinjam)}">
            <td colspan="7" style="text-align:center;color:var(--text-muted);">Tidak ada peminjaman aktif.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2>Riwayat Pengembalian</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>No</th><th>Anggota</th><th>Buku</th><th>Tgl Pinjam</th><th>Tgl Kembali</th></tr>
        </thead>
        <tbody>
          <tr th:each="t,i : ${riwayat}">
            <td th:text="${i.count}"></td>
            <td th:text="${t.anggota.nama}"></td>
            <td th:text="${t.buku.judul}"></td>
            <td th:text="${t.tanggalPinjam}"></td>
            <td th:text="${t.tanggalKembali}"></td>
          </tr>
          <tr th:if="${#lists.isEmpty(riwayat)}">
            <td colspan="5" style="text-align:center;color:var(--text-muted);">Belum ada riwayat pengembalian.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
