<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Anggota – Perpustakaan</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('anggota')}"></div>
<div class="container">
  <h1>Daftar Anggota</h1>

  <div th:if="${pesan}" class="alert alert-danger" th:text="${pesan}"></div>

  <div class="card">
    <h2>Tambah Anggota</h2>
    <form th:action="@{/anggota}" method="post" class="form-row">
      <input name="idAnggota"   placeholder="ID Anggota" required maxlength="10">
      <input name="nama"        placeholder="Nama"       required maxlength="100" style="flex:1;min-width:180px;">
      <input name="batasPinjam" placeholder="Batas Pinjam" type="number" min="1" value="2" required>
      <button type="submit" class="btn btn-primary">Simpan</button>
    </form>
  </div>

  <div class="card">
    <h2>Data Anggota</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>ID</th><th>Nama</th><th>Batas Pinjam</th><th>Aksi</th></tr>
        </thead>
        <tbody>
          <tr th:each="a : ${daftarAnggota}">
            <td th:text="${a.idAnggota}"></td>
            <td th:text="${a.nama}"></td>
            <td th:text="${a.batasPinjam}"></td>
            <td>
              <form th:action="@{/anggota/hapus}" method="post" style="display:inline"
                    onsubmit="return confirm('Hapus anggota ini?')">
                <input type="hidden" name="idAnggota" th:value="${a.idAnggota}">
                <button type="submit" class="btn btn-danger btn-sm">Hapus</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(daftarAnggota)}">
            <td colspan="4" style="text-align:center;color:var(--text-muted);">Belum ada data anggota.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
