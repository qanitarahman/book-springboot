<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Buku – Perpustakaan</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('buku')}"></div>
<div class="container">
  <h1>Daftar Buku</h1>

  <div th:if="${pesan}" class="alert alert-danger" th:text="${pesan}"></div>

  <div class="card">
    <h2>Tambah Buku</h2>
    <form th:action="@{/buku}" method="post" class="form-row">
      <input name="idBuku"  placeholder="ID Buku"  required maxlength="10">
      <input name="judul"   placeholder="Judul"    required maxlength="200" style="flex:1;min-width:180px;">
      <input name="stok"    placeholder="Stok" type="number" min="0" value="1" required>
      <button type="submit" class="btn btn-primary">Simpan</button>
    </form>
  </div>

  <div class="card">
    <h2>Data Buku</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>ID</th><th>Judul</th><th>Stok</th><th>Aksi</th></tr>
        </thead>
        <tbody>
          <tr th:each="b : ${daftarBuku}">
            <td th:text="${b.idBuku}"></td>
            <td th:text="${b.judul}"></td>
            <td>
              <span th:if="${b.stok > 0}"  class="badge badge-success" th:text="${b.stok}"></span>
              <span th:if="${b.stok == 0}" class="badge badge-danger">Habis</span>
            </td>
            <td>
              <form th:action="@{/buku/hapus}" method="post" style="display:inline"
                    onsubmit="return confirm('Hapus buku ini?')">
                <input type="hidden" name="idBuku" th:value="${b.idBuku}">
                <button type="submit" class="btn btn-danger btn-sm">Hapus</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(daftarBuku)}">
            <td colspan="4" style="text-align:center;color:var(--text-muted);">Belum ada data buku.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
